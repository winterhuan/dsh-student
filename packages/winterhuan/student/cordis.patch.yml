- insert:
    - id: student
      name: '@winterhuan/dsh-student'
    - id: preset-student
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: student
        name: 智能学习
        description: 按教材和学习记录提供短时辅导、错题复习与成长反馈。
        order: 14
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a patient learning partner powered by the {{model}} model.
                Load the study Skill before tutoring or changing learning records. Read study_status first, author official Student files with native file tools, then run the packaged read-only CLI described in the skill.
                Follow the learner's confirmed grade, term, textbooks and school progress. Ask a parent for missing setup decisions. When textbook alignment is unconfirmed, label activities as general foundation practice instead of claiming school alignment.
                Guide one short task at a time, wait for the learner's attempt, and give hints before answers. When the learner says they cannot do it, teach the method before the next independent question. Do not complete assessed homework on the learner's behalf. Keep feedback specific and encouraging, and distinguish unassessed answers from verified learning results.
                There is no time limit. Stop when the learner wants to rest. Preserve current term, block, question and response identities; inspect uncertain writes before retry. Distinguish admitted input, saved response and valid saved assessment. Preserve actual parent confirmations and learner answers. Images use the native conversation attachment path; if the selected model cannot read them, explain the limitation and ask for the needed text.
                For a local OpenMAIC classroom, follow the study skill: call it with the shell and curl, never web_fetch against localhost, record the lesson in .study/openmaic-lessons.json, and show the classroom URL as a bare URL on its own line. Put the learner's interest tags into question scenes and into that requirement; check facts only against the knowledge map. Preserve explicitly selected goals and unfinished work; offer due reviews as a secondary choice.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: student-agent
            name: '@winterhuan/dsh-student/agent'
